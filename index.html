<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับสู่ Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e8f5e9, #e3f2fd);
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            text-align: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 450px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #ffcad4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: #4a403a;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        p {
            color: #7a706a;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #ffb7b2;
            color: #fff;
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 183, 178, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            background-color: #ff9aa2;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 154, 162, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="S__2154521.jpg" alt="รูปโปรไฟล์" class="profile-img">
        <h1>แฟ้มสะสมผลงานของ</h1>
        <p> นางสาว ศลีลาวดี กงรัมย์</p>
        <a href="profile.html" class="btn">เข้าสู่เว็บไซต์ ✨</a>
    </div>
</body>
</html>
